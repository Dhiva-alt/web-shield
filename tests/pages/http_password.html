<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Password on Insecure HTTP Page</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fff1f2; color: #222; }
    .box { background: white; padding: 24px; border-radius: 8px; max-width: 480px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
    button { background: #e11d48; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
    .badge { background: #fecdd3; color: #9f1239; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">Defensive Test Scenario</span>
    <h2>Insecure HTTP Password Form</h2>
    <p>When served over <code>http://localhost:8000/tests/pages/http_password.html</code>, this unencrypted page exposes credentials transmitted across cleartext connections.</p>

    <form action="/login-handler" method="POST">
      <label for="user">Account Email:</label>
      <input type="text" id="user" name="user" placeholder="test@example.com">

      <label for="pass">Password:</label>
      <input type="password" id="pass" name="pass" placeholder="••••••••">

      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
