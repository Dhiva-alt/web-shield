<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Child Iframe Form</title>
  <style>
    body { font-family: sans-serif; padding: 10px; margin: 0; background: #e0f2fe; }
    input { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h4>Embedded Password Form</h4>
  <form action="/iframe-auth" method="POST">
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password inside iframe">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
